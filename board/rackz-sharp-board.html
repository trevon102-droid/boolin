<title>Rackz Sharp Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky desk bar with tabs; board = ranked ticket tables per sport, exposure rail beside; log + performance as ledgers */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#101923; --muted:#5A6878; --line:#D3DAE2;
  --accent:#2447A8; --accent-soft:#E1E7F7;
  --good:#11734F; --good-soft:#DCF0E6;
  --warn:#935700; --warn-soft:#F8EBD4;
  --bad:#AE3228; --bad-soft:#F8E0DC;
  --sunk:#F5F7FA; --derived:#5A49B0; --derived-soft:#E9E6F7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1016; --surface:#131A23; --surface-2:#18212C; --ink:#E3E9F0; --muted:#93A1B1; --line:#253140;
    --accent:#88A5F3; --accent-soft:#1B2642;
    --good:#4DC896; --good-soft:#12302A;
    --warn:#F0B55C; --warn-soft:#36290F;
    --bad:#F18B7F; --bad-soft:#3A1C19;
    --sunk:#18211E; --derived:#A99CF0; --derived-soft:#231F3D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1016; --surface:#131A23; --surface-2:#18212C; --ink:#E3E9F0; --muted:#93A1B1; --line:#253140;
  --accent:#88A5F3; --accent-soft:#1B2642;
  --good:#4DC896; --good-soft:#12302A;
  --warn:#F0B55C; --warn-soft:#36290F;
  --bad:#F18B7F; --bad-soft:#3A1C19;
  --sunk:#18211E; --derived:#A99CF0; --derived-soft:#231F3D;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 72px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.7rem;text-transform:uppercase}
h3{font-size:1.25rem;text-transform:uppercase}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font:600 .7rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}

/* desk bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
.bar-in{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.brand h1{font-size:2rem;text-transform:uppercase}
.brand .unit{font-size:.82rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .8rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 11px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

section.view{display:flex;flex-direction:column;gap:22px;padding-top:24px}
[hidden]{display:none!important}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.spread{justify-content:space-between}

/* controls */
button.btn,select,input{font:500 .9rem/1.2 var(--f-body);color:var(--ink)}
button.btn{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.btn.sm{padding:5px 9px;font-size:.78rem}
button.btn.ghost{background:none}
button.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
input.num{width:100%}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 .76rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.pill{display:inline-block;font:600 .68rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:4px 7px;border-radius:3px;white-space:nowrap}
.p-max{background:var(--good);color:var(--surface)}
.p-strong{background:var(--good-soft);color:var(--good)}
.p-std{background:var(--accent-soft);color:var(--accent)}
.p-small{background:var(--warn-soft);color:var(--warn)}
.p-pass{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.t-good{color:var(--good)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)}

.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:4px;padding:10px 14px;font-size:.9rem}
.banner strong{color:var(--warn)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.strip > div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.strip .big{font:600 1.45rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}

/* board layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
.sport-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
table.board-t{min-width:980px}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .68rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td .pick{font-weight:600}
td .sub{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
tr.passrow td{color:var(--muted)}
tr.passrow .pick{text-decoration:line-through;text-decoration-color:var(--line)}
.why{max-width:34ch}
.inputs{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.76rem;color:var(--muted)}
.inputs li::before{content:"› ";color:var(--accent)}
.factors{margin:8px 0 0;padding:8px 10px;list-style:none;display:flex;flex-direction:column;gap:3px;font:500 .74rem/1.35 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.factors li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:6px}
.factors .adj{text-align:right;font-variant-numeric:tabular-nums}
.factors .pos{color:var(--good)} .factors .neg{color:var(--bad)}
.factors .tot{border-top:1px dashed var(--line);padding-top:3px;font-weight:600}
.stale-tag{display:inline-block;margin-top:4px;font:600 .66rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:3px;background:var(--warn-soft);color:var(--warn)}
tr.stalerow td{opacity:.6}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.fdlink{font:600 .75rem/1 var(--f-body);color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:6px 10px;text-decoration:none}
.copybtn{font:600 .75rem/1 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
details.notes summary{cursor:pointer;list-style:none;font-size:.86rem;color:var(--muted);max-width:72ch}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary b{color:var(--accent);font-weight:600}
.badge-noise{display:inline-block;font:600 .66rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:3px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
@media (max-width:600px){
  table.board-t{min-width:0!important}
  table.board-t thead{display:none}
  table.board-t, table.board-t tbody, table.board-t tr, table.board-t td{display:block;width:100%}
  table.board-t tr{border-bottom:1px solid var(--line);padding:10px 4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}
  table.board-t td{border:0;padding:2px 6px;text-align:left!important}
  table.board-t td[data-label]::before{content:attr(data-label);display:block;font:600 .62rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  table.board-t td.c-play, table.board-t td.c-why, table.board-t td.c-betto, table.board-t td.c-res{grid-column:1/-1}
  table.board-t td.c-why{max-width:none}
  table.board-t td.c-why .factors, table.board-t td.c-why .inputs{display:none}
  table.board-t tr.open td.c-why .factors, table.board-t tr.open td.c-why .inputs{display:flex}
  .why-more{display:inline-block;margin-top:4px;font:600 .72rem/1 var(--f-body);color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer}
}
@media (min-width:601px){ .why-more{display:none} }
.mv{display:inline-block;margin-top:4px;font:600 .66rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:3px;white-space:nowrap}
.mv-with{background:var(--good-soft);color:var(--good)} .mv-against{background:var(--bad-soft);color:var(--bad)} .mv-stale{background:var(--accent-soft);color:var(--accent)}
.betto{font-family:var(--f-mono);font-size:.8rem;white-space:nowrap}
.pickcell{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.logbtn{font:600 .75rem/1 var(--f-body);background:var(--accent);color:var(--surface);border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
.logbtn:hover{filter:brightness(1.1)}
.logbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.ladder{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ladder-head{padding:12px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;border-bottom:1px solid var(--line)}
.ladder table{min-width:560px}

/* exposure rail */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
@media (max-width:900px){.rail{position:static}}
.expo{display:flex;flex-direction:column;gap:5px}
.expo .top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.meter{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter.over i{background:var(--bad)}
.meter .cap{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:28px 20px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.empty h3{font-size:1.4rem}

/* cards/forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.out > div{background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.out .v{font:600 1.15rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:.86rem;color:var(--muted);max-width:72ch}
code,pre{font-family:var(--f-mono);font-size:.8rem}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:12px;overflow-x:auto;margin:0}

/* log */
table.log-t{min-width:980px}
table.log-t input,table.log-t select{padding:5px 7px;font-size:.84rem}
table.log-t input{width:82px}
.res-win{color:var(--good);font-weight:600}.res-loss{color:var(--bad);font-weight:600}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--f-mono)}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
@media (min-width:700px){.sheet-back{align-items:center}}
/* top 5 */
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jumps a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-size:.86rem}
.jumps a:hover,.jumps a:focus-visible{border-color:var(--accent);outline:none}
.jumps b{font:700 1rem/1 var(--f-display);color:var(--accent)}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;scroll-margin-top:120px;min-width:0}
.feat-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.rankno{grid-row:span 3;font:700 3rem/0.9 var(--f-display);color:var(--accent);min-width:1.4ch}
.feat-head h2{font-size:1.9rem}
.feat-head .sub{color:var(--muted);font-size:.86rem}
.feat-head .headline{font-weight:600}
.feat-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.read p{max-width:68ch}
.injl{margin:6px 0 0;padding-left:18px;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
table.mu{min-width:0;font-size:.86rem}
table.mu td.adv{font-weight:600;color:var(--good)}
.sgps{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.sgp{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sgp ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.sgp li{display:flex;justify-content:space-between;gap:10px}
.sgp li span:first-child{flex:1;min-width:0}
.sgp dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.84rem}
.sgp dt{color:var(--muted)} .sgp dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sgp .betat{border-top:1px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* parlays */
.legs{display:flex;flex-direction:column;gap:6px}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer}
.leg:hover{border-color:var(--accent)}
.leg input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.leg.on{border-color:var(--accent);background:var(--accent-soft)}
.leg.clash{opacity:.55}
.leg .sub{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.leg b{font-family:var(--f-mono)}
.slip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
@media (max-width:900px){.slip{position:static}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:.88rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}

/* ---------- execution: research tier vs bet permission ---------- */
.bs{display:inline-block;font:700 .68rem/1.15 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:5px 7px;border-radius:3px;border:1px solid transparent;white-space:normal;max-width:15em}
.bs-bet{background:var(--good);color:var(--surface)}
.bs-wait{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.bs-not{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.bs-pass{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.exec{display:flex;flex-direction:column;gap:3px;min-width:11em}
.exec .sub{white-space:normal}
.rsz{font-size:.74rem;color:var(--muted);display:block;margin-top:3px}
.ps-stale,.ps-missing,.ps-no{color:var(--warn);font-weight:600}
.clvcell{display:flex;flex-direction:column;gap:2px;font-size:.78rem}
.clvcell b{font:600 .62rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.closein{display:flex;gap:4px}.closein input{width:5.2em}
.method{display:inline-block;font:600 .64rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;padding:3px 6px;border-radius:3px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

/* ---------- research tab (shared with research/render.py, scoped to .rx) ---------- */
/*RX_CSS_BEGIN*/
.rx h2{font-size:1.6rem}
.rx h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em}
.rx p{margin:0}
.rx .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}
.rx .muted{color:var(--muted)} .rx .small{font-size:.84rem}
.rx .label{font:600 .68rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.rx .list{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 130px);overflow:auto;padding-right:4px}
@media (max-width:900px){.rx .list{position:static;max-height:none}}
.rx .layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.rx .layout{grid-template-columns:minmax(0,1fr)}}
.rx .group{display:flex;flex-direction:column;gap:6px}
.rx .game{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 11px;cursor:pointer}
.rx .game:hover{border-color:var(--accent)}
.rx .game:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rx .game[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.rx .game .mt{font-weight:600}
.rx .game .why{grid-column:2/-1;font-size:.78rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rx .lg{font:700 .7rem/1 var(--f-display);letter-spacing:.06em;background:var(--ink);color:var(--bg);border-radius:3px;padding:4px 5px;margin-top:2px}
.rx .pips{display:flex;gap:2px;margin-top:5px}
.rx .pips i{width:6px;height:6px;border-radius:1px;background:var(--line)}
.rx .pips i.on{background:var(--warn)} .rx .pips i.hot{background:var(--bad)}

<script>
(function(){
"use strict";

/* ---------- research module (generated from research/render.py RX_JS) ---------- */
/*RX_JS_BEGIN*/
const RX=(function(){
"use strict";
const esc=s=>String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const am=o=>o===null||o===undefined?'—':(o>0?'+'+o:String(o));
const pct=(x,d=1)=>x===null||x===undefined?'—':(x*100).toFixed(d)+'%';
const sgn=(x,d=1)=>x===null||x===undefined?'—':(x>0?'+':'')+Number(x).toFixed(d);
const line=x=>x===null||x===undefined?'—':(x>0?'+':'')+x;
function tET(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return esc(iso); return d.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' ET'; }
function ageMin(iso){ const d=new Date(iso); return isNaN(d)?null:Math.max(0,(Date.now()-d.getTime())/60000); }
function ageLbl(m){ if(m===null) return 'unknown age'; if(m<1) return 'just now'; if(m<60) return Math.round(m)+' min old'; if(m<2880) return (m/60).toFixed(m<600?1:0)+' h old'; return Math.round(m/1440)+' d old'; }
const kindChip=k=>`<span class="chip k-${esc(k||'unknown')}">${esc((k||'unknown'))}</span>`;
const statusCls=s=>s==='lean'?'s-lean':s==='watch'?'s-watch':s==='pass'?'s-pass':s==='review required'?'s-review':'s-insufficient';
const statusTxt=s=>s==='insufficient information'?'need info':s==='review required'?'review':(s||'—');
const recCls=r=>!r||r==='NOT READY'||r==='CALIBRATION NEEDED'?'v-bad':r==='PROMISING BUT UNCALIBRATED'?'v-warn':'v-good';
function calTxt(v){ const c=(v&&v.calibration_status)||'uncalibrated'; return c.startsWith('calibrated')?'CALIBRATED':c.startsWith('needs')?'NEEDS CALIBRATION':'UNCALIBRATED'; }
/* one line per modeled league: Model · Calibration · Validation · Recommendation */
function valBanner(map){
  const ent=Object.entries(map||{}); if(!ent.length) return '';
  return `<div class="vline" aria-label="Model validation status">${ent.map(([lg,v])=>`<span><b>${esc(lg)}</b> · Model: ${esc((v&&v.model_version)||'—')} · Calibration: <b class="${calTxt(v)==='CALIBRATED'?'v-good':'v-bad'}">${calTxt(v)}</b> · Validation: ${esc((v&&v.validation_status)||'not validated')} · <b class="${recCls(v&&v.recommendation)}">${esc((v&&v.recommendation)||'NOT READY')}</b></span>`).join('')}</div>`;
}
const fact=f=>!f?'<span class="muted">—</span>':(f.value===null||f.value===undefined?`<span class="muted">unknown</span> ${kindChip('unknown')}<span class="sub">${esc(f.reason||'')}</span>`:`${esc(typeof f.value==='object'?JSON.stringify(f.value):f.value)} ${kindChip(f.kind)}${f.source?`<span class="sub">${esc(f.source)}${f.note?' · '+esc(f.note):''}</span>`:''}`);

/* ---------- board ---------- */
function pips(score){ const n=Math.min(8,Math.round(score)); return `<span class="pips" aria-label="importance ${score}">${Array.from({length:8},(_,i)=>`<i class="${i<n?(n>=6?'hot':'on'):''}"></i>`).join('')}</span>`; }
function item(e){ return `<button class="game" data-key="${esc(e.key)}" aria-current="false"><span class="lg">${esc(e.league)}</span>
  <span><span class="mt">${esc(e.matchup)}</span><span class="sub">${esc(e.start||'')}</span>${pips(e.importance)}</span>
  <span class="chip ${statusCls(e.research_status)}">${esc(statusTxt(e.research_status))}</span>
  ${e.reasons&&e.reasons.length?`<span class="why">${esc(e.reasons[0])}</span>`:(e.why_stable?`<span class="why">${esc(e.why_stable)}</span>`:'')}</button>`; }
function group(title,note,rows){ return `<section class="group"><div><h3>${esc(title)} <span class="muted num">${rows.length}</span></h3>${note?`<p class="note">${esc(note)}</p>`:''}</div>${rows.length?rows.map(item).join(''):'<p class="empty">None.</p>'}</section>`; }
/* ---------- dossier ---------- */
function spark(series){
  const pts=(series||[]).filter(p=>p.spread_home!==null&&p.spread_home!==undefined);
  if(pts.length<2) return '<p class="empty">Not enough observations for a line chart yet.</p>';
  const W=600,H=70,L=34,R=8,T=8,Bm=16; const ys=pts.map(p=>p.spread_home); let lo=Math.min(...ys),hi=Math.max(...ys); if(hi-lo<1){hi+=0.5;lo-=0.5;}
  const x=i=>L+(W-L-R)*i/(pts.length-1), y=v=>T+(H-T-Bm)*(v-lo)/(hi-lo);
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.spread_home).toFixed(1)).join(' ');
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Home spread from ${line(ys[0])} to ${line(ys[ys.length-1])}">
    <text x="${L-6}" y="${(y(hi)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${line(hi)}</text>
    <text x="${L-6}" y="${(y(lo)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${line(lo)}</text>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.spread_home).toFixed(1)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
    <text x="${L}" y="${H-3}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">first seen</text><text x="${W-R}" y="${H-3}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">latest</text>
  </svg></div>`;
}
function px(side){ if(!side) return '—'; return `<span class="num">${am(side.fanduel)}</span><span class="sub">DK ${am(side.draftkings)} · best ${am(side.best)}${side.best_book?' '+esc(side.best_book):''}</span>`; }
function mrow(label,pt,kind,c){
  if(!pt) return `<tr><td>${label}</td><td colspan="4" class="muted">—</td></tr>`;
  const ts=`<span class="sub">${tET(pt.t)}${pt.last_seen&&pt.last_seen!==pt.t?' → '+tET(pt.last_seen):''}</span>`;
  if(kind==='spread') return `<tr><td>${label}${ts}</td><td class="n num">${esc(c.game.home.abbr)} ${line(pt.home_line)}</td><td class="n">${px(pt.away)}</td><td class="n">${px(pt.home)}</td><td class="n num">${pct(pt.fair_home)}</td></tr>`;
  if(kind==='total') return `<tr><td>${label}${ts}</td><td class="n num">${pt.line}</td><td class="n">${px(pt.over)}</td><td class="n">${px(pt.under)}</td><td class="n num">${pct(pt.fair_over)}</td></tr>`;
  return `<tr><td>${label}${ts}</td><td class="n num">—</td><td class="n">${px(pt.away)}</td><td class="n">${px(pt.home)}</td><td class="n num">${pct(pt.fair_home)}</td></tr>`;
}
function marketSec(c){
  const m=c.market||{}; const blocks=['spread','moneyline','total'].map(k=>{ const x=m[k]||{};
    if(!x.available) return `<div><span class="label">${k}</span><p class="empty">${esc(x.reason||'no data')}</p></div>`;
    const cols=k==='total'?['Line','Over (FanDuel)','Under (FanDuel)','No-vig over']:k==='spread'?['Line','Away (FanDuel)','Home (FanDuel)','No-vig home cover']:['','Away (FanDuel)','Home (FanDuel)','No-vig home win'];
    const mv=x.movement||{}; const mvs=[];
    if(mv.home_line) mvs.push(`line ${sgn(mv.home_line,1)} toward ${esc(mv.toward==='home'?c.game.home.abbr:c.game.away.abbr)}`);
    if(mv.line) mvs.push(`total ${sgn(mv.line,1)} (${esc(mv.toward)})`);
    if(mv.fair_home) mvs.push(`no-vig home ${sgn(mv.fair_home*100,1)} pp`);
    if(mv.fair_over) mvs.push(`no-vig over ${sgn(mv.fair_over*100,1)} pp`);
    Object.entries(mv).filter(([kk])=>kk.startsWith('fanduel_')).forEach(([kk,v])=>mvs.push(`FanDuel ${esc(kk.slice(8))} ${am(v.from)} → ${am(v.to)} (${sgn(v.implied_change*100,1)} pp implied)`));
    return `<div class="scroll"><table><thead><tr><th>${esc(k)} · ${x.observations} obs</th>${cols.map(h=>`<th class="n">${h}</th>`).join('')}</tr></thead><tbody>
      ${mrow('Open (first seen)',x.open,k,c)}${mrow('Current',x.current,k,c)}${x.close?mrow('Close (last before start)',x.close,k,c):`<tr><td colspan="5" class="muted small">Close: ${esc(x.close_note)}</td></tr>`}</tbody></table>
      <p class="small">${mvs.length?'<strong>Movement:</strong> '+mvs.join(' · '):'<span class="muted">No movement since first seen.</span>'}</p></div>`; }).join('');
  return `<section class="sec"><header><div><span class="q">What does the market say · how did it move</span><h2>Market</h2></div>
    <span class="legend">${kindChip('reported')}<span class="small muted">FanDuel = actionable · DK/best = context · no-vig = estimate, not a price</span></span></header>
    ${spark(m.series)}${blocks}${(m.event_flags||[]).length?`<p class="note">Feed flags: ${m.event_flags.map(esc).join('; ')}</p>`:''}</section>`;
}
function modelSec(c){
  const m=c.model||{}, cmp=c.comparison||{};
  if(!m.available) return `<section class="sec"><header><div><span class="q">What does Boolin think</span><h2>Boolin view</h2></div>${kindChip('unknown')}</header><p class="empty">${esc(m.reason||'No projection.')}</p></section>`;
  const maxAbs=Math.max(0.01,...(m.contributions||[]).map(x=>Math.abs(x.margin)));
  const bars=(m.contributions||[]).map(x=>{ const w=Math.abs(x.margin)/maxAbs*50; const left=x.margin>=0?50:50-w;
    return `<div class="cb"><span>${esc(x.name)}<span class="sub">${esc(x.note||'')}</span></span><span class="track"><span style="left:${left}%;width:${w}%"></span><span class="zero"></span></span><span class="num" style="text-align:right">${sgn(x.margin,2)}</span></div>`; }).join('');
  const rows=(cmp.rows||[]).map(r=>`<tr><td>${esc(r.dimension)}${r.note?`<span class="sub">${esc(r.note)}</span>`:''}</td><td class="n num">${r.unit==='pp'?pct(r.market):r.dimension==='Total'?r.market:line(r.market)}</td><td class="n num">${r.unit==='pp'?pct(r.boolin):r.dimension==='Total'?r.boolin:line(r.boolin)}</td><td class="n num">${sgn(r.difference,1)} ${esc(r.unit)}</td><td><span class="chip ${r.label==='aligned'?'s-pass':r.label==='mild disagreement'?'sev-info':r.label==='significant disagreement'?'sev-watch':'sev-alert'}">${esc(r.label)}</span><span class="sub">${esc(r.direction)}</span></td></tr>`).join('');
  return `<section class="sec"><header><div><span class="q">What does Boolin think · where does it disagree</span><h2>Boolin vs market</h2></div>
    <span class="legend">${kindChip('derived')}<span class="small muted">${esc(m.version)} · confidence ${esc(m.confidence)}</span></span></header>
    ${valGrid(c)}
    <div class="two"><div><span class="label">Projection</span><p class="num" style="font-size:1rem">${esc(c.game.home.abbr)} ${pct(m.home_win_p)} · line ${esc(c.game.home.abbr)} ${line(Math.round(-m.proj_margin_home*10)/10)} · total ${m.proj_total??'—'}</p></div>
      <div><span class="label">Overall</span><p>${esc(cmp.overall||'—')}</p>${cmp.caveat?`<p class="note">${esc(cmp.caveat)}</p>`:''}</div></div>
    ${rows?`<div class="scroll"><table><thead><tr><th>Measure</th><th class="n">Market</th><th class="n">Boolin</th><th class="n">Gap</th><th>Label</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
    <div><span class="label">Why Boolin has this number (home-margin units, sums to the projection)</span><div class="contrib" style="margin-top:6px">${bars}</div></div>
    ${(m.sample_warnings||[]).length?`<ul class="ev ev-unk">${m.sample_warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
    <p class="note">Assumptions: ${(m.assumptions||[]).map(esc).join(' ')} ${esc(cmp.reminder||'')}</p></section>`;
}
function valGrid(c){
  const m=c.model||{}, v=c.validation||{}; const small=(m.sample_warnings||[]).filter(w=>w.startsWith('Small sample'));
  return `<div class="vgrid"><div><span class="label">Model confidence</span><b>${esc(m.confidence||'—')}</b><span class="sub">from the smallest regression weight</span></div>
    <div><span class="label">Sample quality</span><b class="${small.length?'v-warn':''}">${small.length?'small':'normal'}</b><span class="sub">${esc(small[0]||'no small-sample warning')}</span></div>
    <div><span class="label">Calibration status</span><b class="${calTxt(v)==='CALIBRATED'?'v-good':'v-bad'}">${calTxt(v)}</b><span class="sub">${esc(v.model_version||m.version||'')}</span></div>
    <div><span class="label">Validation status</span><b class="${recCls(v.recommendation)}">${esc(v.recommendation||'NOT READY')}</b><span class="sub">${esc(v.validation_status||'not validated')}${v.sample_size?` · holdout n=${v.sample_size}`:''}</span></div></div>`;
}

/* Execution layer: research conviction is NOT bet permission. Pure functions, no DOM; tested by
   tests/test_board_exec.py (node). research tier -> current price -> bet permission -> logged bet -> CLV. */
const EXEC=(function(){
"use strict";
const BET='BET', WAIT='WAIT / RECHECK', PASS='PASS', NOT='NOT BETTABLE AT CURRENT PRICE';
const SGP_VALIDATION_EXISTS=false;   // no historical SGP validation in the repo: "validated" claims are not honoured
const num=v=>{ if(v===null||v===undefined||v==='') return null; const n=Number(String(v).replace(/^\+/,'').trim()); return Number.isFinite(n)?n:null; };
const validAm=o=>o!==null&&(o<=-100||o>=100);
const dec=o=>{ o=num(o); if(!validAm(o)) return null; return o<0?1+100/(-o):1+o/100; };
const isPrice=t=>/^[+-]?\d+$/.test(t)&&Math.abs(Number(t))>=100;
function tokens(s){ return String(s||'').match(/[+-]?\d+(?:\.\d+)?/g)||[]; }
/* "38.5 to -125", "-120 or better at 6.5", "69.5 at -115", "fine to -140", "+150 or better", "-3 -110" */
function parseBetTo(x){
  const sp=num(x&&x.betToPrice), sl=num(x&&x.betToLine);
  if(sp!==null&&validAm(sp)) return {price:sp, line:sl, parsed:true, source:'betToPrice/betToLine'};
  const raw=x&&x.betTo; const t=tokens(raw);
  const prices=t.filter(isPrice).map(Number), lines=t.filter(v=>!isPrice(v)).map(Number);
  if(!prices.length) return {price:null, line:null, parsed:false, raw:raw||null};
  return {price:prices[prices.length-1], line:lines.length?lines[0]:null, parsed:true, raw};
}
/* the current number: explicit `line`, else the first non-price number in the pick text */
function currentLine(x){ const l=num(x&&x.line); if(l!==null) return l; const t=tokens(x&&x.pick).filter(v=>!isPrice(v)); return t.length?Number(t[0]):null; }
/* which way is a better number for the bettor: totals/props Over -> lower, Under -> higher, spreads -> higher */
function lineDir(text){ const s=String(text||''); if(/\bover\b|(^|\s)o\d/i.test(s)) return 'lower'; if(/\bunder\b|(^|\s)u\d/i.test(s)) return 'higher'; return 'higher'; }
function lineBetter(a,b,dir){ return dir==='lower'?a<b:a>b; }   // a strictly better than b
function priceStatus(x, slate, nowMs, staleMin){
  if(!validAm(num(x&&x.odds))) return {status:'missing', age:null};
  const t=(x&&x.priceAt)||(slate&&slate.pricesAt); const d=t?new Date(t):null;
  if(!d||isNaN(d)) return {status:'no timestamp', age:null};
  const age=Math.max(0,(nowMs-d.getTime())/60000);
  return {status: age>(num(staleMin)??1440)?'stale':'fresh', age};
}
/* bet permission for one priced play */
function betStatus(x, ctx){
  ctx=ctx||{}; const ps=priceStatus(x, ctx.slate, ctx.now??Date.now(), ctx.staleMin);
  const thr=parseBetTo(x); const cur={price:num(x&&x.odds), line:currentLine(x)};
  const out=(s,why)=>({bet_status:s, price_status:ps.status, price_age_min:ps.age, reason:why, threshold:thr, current:cur});
  if(x&&x.pass) return out(PASS,'Passed on research (news / not offered).');
  if(ps.status==='missing') return out(WAIT,'No current FanDuel price: recheck before betting.');
  if(ps.status==='no timestamp') return out(WAIT,'Price has no timestamp: recheck before betting.');
  if(ps.status==='stale') return out(WAIT,'Price is stale: recheck before betting.');
  if(!thr.parsed) return out(WAIT, thr.raw?'Bet-to isn\'t a price ("'+thr.raw+'"): set a number before betting.':'No bet-to price set: no execution threshold.');
  const dir=lineDir(x&&x.pick);
  if(thr.line!==null && cur.line!==null && thr.line!==cur.line){
    if(!lineBetter(cur.line,thr.line,dir)) return out(NOT,'Line '+fmtLine(cur.line)+' is worse than the bet-to line '+fmtLine(thr.line)+'.');
  }
  const dc=dec(cur.price), dt=dec(thr.price);
  if(dc+1e-9<dt) return out(NOT,'Price '+fmtAm(cur.price)+' is worse than bet-to '+fmtAm(thr.price)+'.');
  return out(BET, 'Price '+fmtAm(cur.price)+(cur.line!==null?' at '+fmtLine(cur.line):'')+' is at or better than bet-to '+fmtAm(thr.price)+(thr.line!==null?' at '+fmtLine(thr.line):'')+'.');

/* SGPs: an actual current FanDuel slip price with a timestamp, at or better than the bet-at threshold */
function sgpStatus(sg, ctx, minAm){
  ctx=ctx||{};
  if(sg&&sg.pass) return {bet_status:PASS, price_status:'n/a', reason:'Passed on research.'};
  const bp=num(sg&&sg.bookPrice); const t=sg&&sg.bookPriceAt; const d=t?new Date(t):null;
  if(!validAm(bp)) return {bet_status:WAIT, price_status:'missing', reason:'No current FanDuel SGP slip price: build the slip and recheck.'};
  if(!d||isNaN(d)) return {bet_status:WAIT, price_status:'no timestamp', reason:'SGP price has no timestamp: recheck the slip.'};
  const age=Math.max(0,((ctx.now??Date.now())-d.getTime())/60000);
  if(age>(num(ctx.staleMin)??1440)) return {bet_status:WAIT, price_status:'stale', price_age_min:age, reason:'SGP price is stale: recheck the slip.'};
  const thr=parseBetTo(sg); const tp=thr.parsed?thr.price:num(minAm);
  if(!validAm(tp)) return {bet_status:WAIT, price_status:'fresh', price_age_min:age, reason:'No bet-at threshold for this SGP.'};
  if(dec(bp)+1e-9<dec(tp)) return {bet_status:NOT, price_status:'fresh', price_age_min:age, reason:'Slip '+fmtAm(bp)+' is worse than bet-at '+fmtAm(tp)+'.'};
  return {bet_status:BET, price_status:'fresh', price_age_min:age, reason:'Slip '+fmtAm(bp)+' is at or better than '+fmtAm(tp)+'.'};
}
const METHODS={analyst:'Analyst correlation estimate', simulation:'Simulation estimate (not validated)',
               independent:'Independent legs (no correlation)', validated:'Validated correlation model'};
function sgpMethod(sg){
  const m=String((sg&&sg.joint_probability_method)||'').toLowerCase();
  const hasJoint=num(sg&&sg.modelP)!==null;
  let method = METHODS[m]?m:(hasJoint?'analyst':'independent');
  let note=null;
  if(method==='validated' && !SGP_VALIDATION_EXISTS){ method='analyst'; note='Marked "validated", but no SGP validation exists in the repo: shown as an analyst estimate.'; }
  return {method, label:METHODS[method], validated: method==='validated', note};
}
/* CLV that respects the number: never compares prices across different lines */
const KEY={NFL:[3,7], CFB:[3,7]};
function clvFields(b){
  const takenPrice=num(b.taken_price??b.odds), closePrice=num(b.close_price??b.close);
  const takenLine=num(b.taken_line), closeLine=num(b.close_line);
  const mt=String(b.market_type||'').toLowerCase();
  const lineMarket = mt==='spread'||mt==='total'||mt==='prop';
  const dir=b.line_dir||lineDir(b.pick);
  const o={taken_price:validAm(takenPrice)?takenPrice:null, close_price:validAm(closePrice)?closePrice:null,
           taken_line:takenLine, close_line:closeLine, line_delta:null, line_changed:null, price_clv:null, line_clv:null,
           combined_clv:null, key_numbers_crossed:[], clv_note:null};
  const pc = (o.taken_price!==null&&o.close_price!==null) ? dec(o.taken_price)/dec(o.close_price)-1 : null;
  if(takenLine!==null && closeLine!==null){
    o.line_delta=Math.round((closeLine-takenLine)*100)/100;
    o.line_changed=o.line_delta!==0;
    o.line_clv=Math.round((dir==='lower'?closeLine-takenLine:takenLine-closeLine)*100)/100;
    if(!o.line_changed){ o.price_clv=pc; o.combined_clv=pc; }
    else { o.clv_note='Line moved '+fmtLine(takenLine)+' → '+fmtLine(closeLine)+': price CLV across different numbers isn\'t comparable, and there is no validated price-per-point conversion, so combined CLV is unavailable.'; }
    const keys=(KEY[String(b.sport||'').toUpperCase()]||[]);
    // key numbers (football spreads): the move reaches or passes 3 / 7 (e.g. -2.5 -> -3, -3 -> -3.5, +6.5 -> +7.5)
    if(mt==='spread' && o.line_changed && (takenLine===0||closeLine===0||Math.sign(takenLine)===Math.sign(closeLine)))
      keys.forEach(k=>{ const lo=Math.min(Math.abs(takenLine),Math.abs(closeLine)), hi=Math.max(Math.abs(takenLine),Math.abs(closeLine));
        if(lo<=k && k<=hi) o.key_numbers_crossed.push(k); });
    if(o.key_numbers_crossed.length) o.clv_note=(o.clv_note||'')+' Key number '+o.key_numbers_crossed.join(' & ')+' in the move: '+(o.line_clv>0?'you hold the better side of it.':'the close is on the better side of it.');
  } else if(lineMarket && takenLine!==null){
    // number taken is known but the closing number isn't: never assume the close was on the same line
    if(o.close_price!==null) o.clv_note='Enter the closing line too: price CLV needs the close on your number.';
  } else if(lineMarket){
    if(o.close_price!==null) o.clv_note='Line not recorded: price CLV assumes the close was entered at your number.';
    o.price_clv=pc; o.combined_clv=null;
  } else {
    o.price_clv=pc; o.combined_clv=pc;   // moneyline / no-line markets: price CLV is the whole story
  }
  return o;
}

function probLabel(validation){

  picks.forEach(x=>{ if(x.ev.units>0){ const g = x.pk.game||'—'; games[g]=(games[g]||0)+x.ev.units; } });
  const fx = featuredExposure(sl, st); Object.entries(fx).forEach(([g,v])=>{ games[g]=(games[g]||0)+v; });
  const parlayU = parlayUnits(sl, st);
  const total = Object.values(games).reduce((a,b)=>a+b,0) + parlayU;
  const plays = picks.filter(x=>x.ev.units>0).reduce((a,x)=>a+(x.ev.ladder? x.ev.rungs.filter(r=>r.units>0).length:1),0);
  const bettableU = picks.filter(x=>!x.ev.ladder && x.ev.units>0 && execOf(x.pk).bet_status==='BET').reduce((a,x)=>a+x.ev.units,0);
  const waitN = picks.filter(x=>!x.ev.ladder && !x.pk.pass && execOf(x.pk).bet_status!=='BET').length;
  const overGames = Object.entries(games).filter(([g,v])=>v>st.gameCap);
  const passes = picks.filter(x=>x.ev.units===0).length;
  const edges = picks.filter(x=>!x.ev.ladder && x.ev.units>0).map(x=>x.ev.ev);
  const avgEdge = edges.length ? edges.reduce((a,b)=>a+b,0)/edges.length : null;
  const scale = total>st.dailyCap ? st.dailyCap/total : null;

  const opts = S.slates.map(s=>`<option value="${esc(s.id)}" ${s.id===sl.id?'selected':''}>${esc(niceDate(s.date))} · ${esc(s.title||'Slate')}${s.example?' (example)':''}</option>`).join('');

  let html = `

    </div>

  </div>
  ${sl.example?'<div class="banner"><strong>Example slate.</strong> The model % values here are placeholders to show how the board works. Don\'t bet off them. Ask Claude for a real run and it replaces this.</div>':''}
  ${sl.notes?(sl.notes.length>220?`<details class="notes" id="notes-${esc(sl.id)}"><summary>${esc(sl.notes.slice(0,200))}… <b>More</b></summary><p class="note" style="margin-top:6px">${esc(sl.notes)}</p></details>`:`<p class="note">${esc(sl.notes)}</p>`):''}
  <div class="strip">
    <div><span class="label">Plays on card</span><span class="big">${plays}</span><span class="small muted">${passes} ${research(st)?'not sized (no tier or passed)':'passed by the math'}</span></div>
    <div><span class="label">Units on card (research)</span><span class="big ${total>st.dailyCap?'t-bad':''}">${uu(total)}</span><span class="small muted">cap ${st.dailyCap}u · ${money(total*unitDollars())}</span></div>
    <div><span class="label">Bettable now (straights)</span><span class="big ${bettableU>0?'t-good':''}">${uu(bettableU)}</span><span class="small muted">${waitN} play(s) waiting on price · research tier ≠ bet permission</span></div>
    <div><span class="label">${research(st)?'Avg price check (info)':'Avg edge (straights)'}</span><span class="big ${edgeClass(avgEdge)}">${spct(avgEdge)}</span><span class="small muted">${research(st)?'price vs our %, not a gate':'min to bet '+st.minEdge+'%'}</span></div>
    <div><span class="label">Games over cap</span><span class="big ${overGames.length?'t-bad':'t-good'}">${overGames.length}</span><span class="small muted">per-game cap ${st.gameCap}u</span></div>
  </div>
  ${scale?`<div class="banner"><strong>Card is ${uu(total-st.dailyCap)} over the daily cap.</strong> Scale every stake by ${scale.toFixed(2)}×, or cut the lowest-edge plays until it fits.</div>`:''}
  <div class="board"><div class="stack">`;

  const bySport = {};
  shown.forEach(x=>{ (bySport[x.pk.sport||'Other'] = bySport[x.pk.sport||'Other'] || []).push(x); });
  Object.entries(bySport).forEach(([sport, list])=>{
    const straights = list.filter(x=>!x.ev.ladder).sort((a,b)=> (b.ev.units-a.ev.units) || ((b.ev.ev||-9)-(a.ev.ev||-9)));
    const ladders = list.filter(x=>x.ev.ladder);
    html += `<div class="stack" style="gap:14px"><div class="sport-head"><h2>${esc(sport)}</h2><span class="small muted">${straights.length} straights · ${ladders.length} ladders</span></div>`;
    if(straights.length){
      html += `<div class="scroll"><table class="board-t"><thead><tr>
        <th>Play</th><th class="n">FanDuel now</th><th>Research</th><th>Execution</th><th class="n">Research %</th><th class="n">Market prior</th><th class="n">Our line</th><th class="n">${research(st)?'Price check':'Edge'}</th><th>Why</th></tr></thead><tbody>`;
      straights.forEach(({pk,ev},i)=>{
        const ex = execOf(pk); const an = ev.anchor||{};
        html += `<tr class="${ev.units===0?'passrow':''} ${ex.price_status==='stale'?'stalerow':''}">
          <td class="c-play"><div class="pickcell"><div><span class="pick">${esc(pk.pick)}</span><span class="sub">${esc(pk.game||'')}${pk.start?' · '+esc(pk.start):''}</span><span class="sub">${esc(pk.market||'')}${pk.category?' · '+esc(pk.category):''}</span></div>${actions(pk, ex.bet_status==='BET'?ev.units:0, (ev.units>0&&ex.bet_status==='BET')?`<button class="logbtn" data-log="${esc(pk.id)}">Log bet</button>`:'')}</div></td>
          <td class="n num" data-label="FanDuel now">${am(pk.odds)}<span class="sub">${esc(pk.book||'')}${priceNote(ex)?' · '+priceNote(ex):''}</span>${moveTag(pk)}</td>
          <td class="c-res" data-label="Research">${researchCell(pk, ev, ex)}</td>
          <td class="c-betto" data-label="Execution">${execCell(ex, pk)}</td>
          <td class="n num" data-label="${EXEC.probLabel(validationFor(pk.sport)).label}">${pct(ev.p)}${ev.raw!==null&&ev.p!==null&&Math.abs(ev.raw-ev.p)>0.0005?`<span class="sub">raw ${pct(ev.raw)}</span>`:''}<span class="sub">${EXEC.probLabel(validationFor(pk.sport)).validated?'validated model':'analyst estimate'}</span></td>
          <td class="n num" data-label="Market prior">${an.market_prior!==null&&an.market_prior!==undefined?pct(an.market_prior):'—'}${an.analyst_adjustment!==null&&an.analyst_adjustment!==undefined?`<span class="sub">analyst adj ${spct(an.analyst_adjustment)}</span>`:''}</td>
          <td class="n num" data-label="Our line">${am(ev.fair)}</td>
          <td class="n num ${edgeClass(ev.ev)}" data-label="Edge">${spct(ev.ev)}</td>
          <td class="why small c-why"><button class="why-more" data-whymore="1">Show the math</button>${esc(pk.why||'')}${Array.isArray(pk.inputs)&&pk.inputs.length?'<ul class="inputs">'+pk.inputs.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':''}${factorList(pk)}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    ladders.forEach(({pk,ev})=>{
      html += `<div class="ladder"><div class="ladder-head"><div><span class="label">Ladder · counts as one position</span><h3>${esc(pk.pick)}</h3><span class="small muted">${esc(pk.game||'')}${pk.why?' · '+esc(pk.why):''}</span></div>
        <div class="field" style="text-align:right"><span class="label">Ladder total</span><span class="num">${uu(ev.units)} · ${money(ev.units*unitDollars())}</span></div></div>
        <div class="scroll" style="border:0;border-radius:0"><table><thead><tr><th>Rung</th><th class="n">Price</th><th class="n">Model</th><th class="n">Fair</th><th class="n">EV</th><th>Stake</th></tr></thead><tbody>`;
      ev.rungs.forEach((r,ri)=>{
        const [tn,tc] = tier(r.units); const rx={pick:pk.pick+' '+r.label, odds:r.odds, priceAt:r.priceAt||pk.priceAt, betTo:r.betTo, pass:pk.pass};
        const rex = execOf(rx, EXEC.parseBetTo(rx).parsed?null:{betToPrice:betAt(toNum(r.modelP), st)});
        html += `<tr class="${r.units===0?'passrow':''}"><td><div class="pickcell"><span class="pick">${esc(r.label)}</span>${r.units>0&&rex.bet_status==='BET'?`<button class="logbtn" data-log="${esc(pk.id)}" data-rung="${ri}">Log bet</button>`:''}<span class="bs ${BS_CLS[rex.bet_status]}" title="${esc(rex.reason)}">${esc(rex.bet_status)}</span></div></td><td class="n num">${am(r.odds)}</td><td class="n num">${pct(toNum(r.modelP))}</td><td class="n num">${am(r.fair)}</td><td class="n num ${edgeClass(r.ev)}">${spct(r.ev)}</td>
          <td><span class="pill ${tc}">${r.units>0?uu(r.units):(r.ev!==null&&r.ev<0?'Skip · -EV':'Skip')}</span></td></tr>`;
      });
      html += `</tbody></table></div></div>`;
    });
    html += `</div>`;
  });
  if(!shown.length) html += '<p class="muted">No plays for this sport on this slate.</p>';

  // rail
  const gameRows = Object.entries(games).sort((a,b)=>b[1]-a[1]).map(([g,val])=>{
    const w = Math.min(100, val/(Math.max(st.gameCap, val))*100), capAt = st.gameCap/Math.max(st.gameCap,val)*100;
    return `<div class="expo"><div class="top"><span>${esc(g)}</span><span class="num ${val>st.gameCap?'t-bad':''}">${uu(val)}</span></div>
      <div class="meter ${val>st.gameCap?'over':''}"><i style="width:${w}%"></i><span class="cap" style="left:calc(${capAt}% - 1px)"></span></div>
      ${val>st.gameCap?`<span class="small t-bad">Over by ${uu(val-st.gameCap)}. Same game script, so trim to ${st.gameCap}u.</span>`:''}</div>`;
  }).join('');
  html += `</div><aside class="rail" aria-label="Exposure">
    <div><span class="label">Exposure by game</span><p class="small muted">Everything on one game rides one script, including Top 10 props, SGPs, longshots and ladders. The black tick is your ${st.gameCap}u cap.</p></div>
    ${gameRows || '<p class="small muted">No sized plays.</p>'}
    ${parlayU>0?`<div class="expo"><div class="top"><span>Cross-game parlays</span><span class="num">${uu(parlayU)}</span></div><span class="small muted">Spread across games, counted in the daily total.</span></div>`:''}
    ${(()=>{ const mv=[...(sl.picks||[]),...(sl.longshots||[])].filter(x=>x.steam); if(!mv.length) return '';
      return `<div><span class="label">Line moves</span><p class="small muted">A move toward our side confirms the read. A price still behind other books (FanDuel lagging) is the best spot to bet. A move against us is a reason to pause.</p><ul class="rules">${mv.map(x=>`<li><strong>${esc(x.pick)}</strong> <span class="mv ${x.steam==='with'?'mv-with':x.steam==='against'?'mv-against':'mv-stale'}">${x.steam==='with'?'Our way':x.steam==='against'?'Against':'FD lagging'}</span><span class="sub">${esc(x.open?('open '+x.open+' · '):'')}${esc(x.move||'')}</span></li>`).join('')}</ul></div>`; })()}
    ${Array.isArray(sl.rules)&&sl.rules.length?`<div><span class="label">Rules for this slate</span><ul class="rules">${sl.rules.map(r=>'<li>'+esc(r)+'</li>').join('')}</ul></div>`:''}
    <button class="btn" id="add-offcard">Log an off-card bet</button>
  </aside></div>`;
  v.innerHTML = html;
}

/* ---------- RESEARCH ---------- */
function rxSubscribe(date){
  if(!S.db || S.rx.date===date) return;
  if(S.rx.unsub){ try{ S.rx.unsub(); }catch(_){ } }
  S.rx = {date, summary:null, parts:{}, unsub:null, loaded:false};
  S.rx.unsub = S.db.collection('research').where('date','==',date).onSnapshot(q=>{
    const parts={}; let summary=null;
    q.docs.forEach(d=>{ const x=d.data(); if(x.kind==='summary') summary=x; else if(x.kind==='cards') parts[x.part]=x.cards||[]; });
    S.rx.summary=summary; S.rx.parts=parts; S.rx.loaded=true; render();
  }, ()=>{ S.rx.loaded=true; render(); });
}
function rxCards(){
  const sm=S.rx.summary; if(!sm) return {};
  const out={}; for(let i=1;i<=(sm.chunks||0);i++) (S.rx.parts[i]||[]).forEach(c=>{ out[c.key]=c; });
  return out;
}
function rxKeyFor(sport, game){
  if(!S.rx.summary || !game) return null;
  const g=String(game).replace(/^#\d+\s+/,'').trim(); const cards=rxCards();
  const hit=Object.values(cards).find(c=>c.league===sport && c.game && (c.game.home_away===g || (c.game.away.name+' @ '+c.game.home.name)===g));
  return hit?hit.key:null;
}
function renderResearch(){
  const v=document.getElementById('v-research');
  if(S.dbState==='loading' || (S.dbState==='on' && (!S.slatesLoaded || !S.rx.loaded))){ v.innerHTML='<p class="muted">Loading research…</p>'; return; }
  const sl=currentSlate();
  if(S.dbState==='off'){ v.innerHTML='<div class="empty"><h3>Research needs saved data</h3><p>Open the page from your Claude account to see the research cards.</p></div>'; return; }
  const sm=S.rx.summary;
  if(!sm){ v.innerHTML=`<div><h2>Research</h2><p class="note">Why each game matters: line history, what changed, Boolin vs the market, availability and data freshness.</p></div>${slatePicker('slate-pick-rx',sl)}<p class="empty">No research written for ${esc(niceDate(sl&&sl.date))} yet. The daily slate task copies it here after the morning data pull, and the 10:50 AM / 4:50 PM re-checks refresh it.</p>`; return; }
  const cards=rxCards(); const B=sm.board||{}; const M=sm.manifest||{};
  if(!S.rxKey || !cards[S.rxKey]) S.rxKey=((B.attention||[])[0]||(B.stable||[])[0]||(B.upcoming||[])[0]||{}).key||null;
  const health=Object.entries(M.inputs||{}).filter(([k,x])=>x.status).map(([k,x])=>`<span class="chip h-${esc(x.status)}">${esc(k)} ${esc(x.status)}</span>`).join('');
  const list=RX.group('Needs attention','Ranked by what changed, what is unresolved and where Boolin splits from the market. Not a bet ranking.',B.attention||[])+
    RX.group('Stable','No meaningful change, no strong split, inputs fresh.',B.stable||[])+
    `<details class="group"><summary><h3>Upcoming <span class="muted num">${(B.upcoming||[]).length}</span></h3><p class="note">Later games already tracked for line history.</p></summary>${(B.upcoming||[]).slice(0,25).map(RX.item).join('')}</details>`;
  v.innerHTML=`<div class="rxhead"><div><h2>Research</h2><p class="note">Research built ${RX.tET(sm.built_at)} (${RX.ageLbl(RX.ageMin(sm.built_at))}) · ${Object.keys(cards).length} games · ${esc(M.status||'')}. Evidence and uncertainty, not picks.</p>${RX.valBanner(B.validation)}</div>
    <div class="row">${slatePicker('slate-pick-rx',sl)}<div class="health">${health}</div></div></div>
    <div class="layout"><nav class="list" aria-label="Research board">${list}</nav><article class="dossier" id="rx-dossier">${RX.dossier(cards[S.rxKey])}</article></div>`;
  v.querySelectorAll('.game').forEach(b=>b.setAttribute('aria-current',String(b.dataset.key===S.rxKey)));
}

/* ---------- TOP 5 ---------- */
function propRows(f, st){
  return (f.props||[]).map((pk,i)=>{
    const ev = evalPick(pk, st); const ex = execOf(pk);
    return `<tr class="${ev.units===0&&!research(st)?'passrow':''}">
      <td><div class="pickcell"><div><span class="pick">${esc(pk.pick)}</span><span class="sub">${esc(pk.market||'')}${pk.onBoard?' · also on Board':''}</span></div>${ev.units>0&&ex.bet_status==='BET'?`<button class="logbtn" data-flog="${esc(f.game)}" data-fi="${i}">Log bet</button>`:''}</div></td>
      <td class="n num">${am(pk.odds)}<span class="sub">${esc(pk.book||'')}${priceNote(ex)?' · '+priceNote(ex):''}</span></td>
      <td class="n num">${pct(toNum(pk.modelP))}</td>
      <td class="n num">${am(ev.fair)}</td>
      <td class="n num ${edgeClass(ev.ev)}">${spct(ev.ev)}</td>
      <td>${researchCell(pk, ev, ex)}</td>
      <td>${execCell(ex, pk)}</td>
      <td class="why small">${esc(pk.why||'')}${Array.isArray(pk.inputs)&&pk.inputs.length?'<ul class="inputs">'+pk.inputs.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':''}</td></tr>`;
  }).join('');
}
function sgpCard(f, sg, j, st){
  const e = sgpEval(sg, st);
  const lift = e.indep && e.p ? e.p/e.indep : null;
  const mth = EXEC.sgpMethod(sg); const ex = EXEC.sgpStatus(sg, {now:Date.now(), staleMin:st.staleMin}, e.minAm);
  return `<div class="sgp">
    <div class="row spread"><div><span class="label">SGP ${j+1}${sg.legs?' · '+sg.legs.length+' legs':''}${sg.lottery?' · <span class="pill p-small">Sprinkle</span>':''}</span><h3>${esc(sg.name||'Same-game parlay')}</h3></div>
      <div class="exec" style="align-items:flex-end"><span class="pill ${e.units>0?'p-std':'p-pass'}">${e.units>0?(convOf(sg)&&research(st)?'Research · Tier '+convOf(sg)+' · ':'Up to ')+uu(e.units):(research(st)?'Not tiered':'Pass')}</span><span class="bs ${BS_CLS[ex.bet_status]||''}">${esc(ex.bet_status)}</span></div></div>
    <ol>${(sg.legs||[]).map(l=>`<li><span>${esc(l.pick)}</span><span class="num">${am(l.odds)}${toNum(l.modelP)!==null?' · '+pct(toNum(l.modelP),0):''}</span></li>`).join('')}</ol>
    ${sg.script?`<p class="small">${esc(sg.script)}</p>`:''}
    <dl>
      <dt>Legs multiplied</dt><dd>${am(e.rawAm)}</dd>
      <dt>Chance if independent</dt><dd>${pct(e.indep)}</dd>
      <dt>Joint chance</dt><dd>${pct(e.p)} <span class="method">${esc(mth.label)}</span></dd>
      <dt>Correlation uplift</dt><dd>${lift?lift.toFixed(2)+'× vs independent':'—'}</dd>
      <dt>Fair price (${mth.validated?'validated':'estimate'})</dt><dd>${am(e.fairAm)}</dd>
      <dt>FanDuel SGP now</dt><dd>${e.bookAm!==null?am(e.bookAm)+(sg.bookPriceAt?' · '+esc(ageText(Math.max(0,(Date.now()-new Date(sg.bookPriceAt).getTime())/60000))):' · no timestamp'):'not priced'}</dd>
      ${e.bookAm!==null?`<dt>Edge at slip price</dt><dd class="${edgeClass(e.ev)}">${spct(e.ev)}</dd>`:''}
    </dl>
    ${mth.note?`<p class="small t-warn">${esc(mth.note)}</p>`:''}
    <p class="small muted">${mth.method==='analyst'?'Analyst correlation estimate: a judgment about how the legs move together, not a validated model.':mth.method==='independent'?'No correlation assumed: legs multiplied.':mth.method==='simulation'?'Simulation estimate: not validated against results yet.':'Validated correlation model.'}</p>
    ${sg.correlation?`<p class="small muted">${esc(sg.correlation)}</p>`:''}
    <div class="betat"><span class="small"><strong>Bet only at ${am(e.minAm)} or better</strong> on the slip · ${esc(ex.reason)}</span>
      ${e.units>0&&ex.bet_status==='BET'?`<button class="logbtn" data-sgplog="${esc(f.game)}" data-sj="${j}">Log bet</button>`:''}</div>
  </div>`;
}

/* ---------- HIT RATES ---------- */
function hitRate(h){ const a=toNum(h.hits), n=toNum(h.of); return a!==null&&n ? a/n : null; }
function renderHits(){
  const v=document.getElementById('v-hits');
  if(S.dbState==='loading' || (S.dbState==='on' && !S.slatesLoaded)){ v.innerHTML='<p class="muted">Loading…</p>'; return; }
  const sl=currentSlate(); const st=S.settings;
  const all=(sl&&Array.isArray(sl.hitrates)?sl.hitrates:[]).map((h,i)=>({...h,_k:'h'+i,_r:hitRate(h)}));
  let html=`<div class="row spread"><div><h2>Hit rates</h2><p class="note">Lines that have cashed in nearly every recent game: the last 10 (or the season so far), with the game log behind it. Tap to build a same-game or cross-game slip. History, not a guarantee: check the role and the matchup in the why.</p></div>${slatePicker('slate-pick-hits',sl)}</div>`;
  if(!all.length){ v.innerHTML=html+'<div class="empty"><span class="label">No hit-rate lines on this slate</span><h3>"Hit in 9 of 10" lines land here</h3><p>The daily run lists every line on the day\'s games that cleared in 80%+ of recent games, with the log.</p></div>'; return; }
  const games=['All',...new Set(all.map(h=>h.game))];
  if(!games.includes(S.hgame)) S.hgame='All';
  const shown=all.filter(h=>(h._r??0)>=S.hmin-1e-9 && (S.hgame==='All'||h.game===S.hgame) && !started(sl.date,h.start)).sort((a,b)=>(b._r-a._r)||String(a.game).localeCompare(b.game));
  html+=`<div class="row spread"><div class="chips" role="group" aria-label="Minimum hit rate">${[0.7,0.8,0.9,1].map(x=>`<button data-hmin="${x}" aria-pressed="${Math.abs(S.hmin-x)<1e-9}">${x===1?'10/10':Math.round(x*100)+'%+'}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Game">${games.map(g=>`<button data-hgame="${esc(g)}" aria-pressed="${g===S.hgame}">${esc(g)}</button>`).join('')}</div></div>`;
  S.hb=S.hb.filter(k=>all.some(h=>h._k===k));
  const chosen=all.filter(h=>S.hb.includes(h._k));
  html+=`<div class="board"><div class="stack" style="gap:8px">${shown.length?`<div class="legs">${shown.map(h=>{ const on=S.hb.includes(h._k);
    return `<label class="leg ${on?'on':''}" for="hl-${h._k}"><input type="checkbox" id="hl-${h._k}" data-hleg="${h._k}" ${on?'checked':''}>
      <span><span class="pick" style="font-weight:600">${esc(h.pick)}</span><span class="sub">${esc(h.game||'')} · ${esc(h.sport||'')}${h.start?' · '+esc(h.start):''}</span>
      ${Array.isArray(h.log)&&h.log.length?`<span class="sub num">Log (newest first): ${h.log.map(x=>esc(x)).join(', ')}</span>`:''}${h.note?`<span class="sub">${esc(h.note)}</span>`:''}</span>
      <span class="num small" style="text-align:right"><b>${esc(h.hits)}/${esc(h.of)}</b><span class="sub">${h.odds!==undefined&&h.odds!==null?am(h.odds)+' FD':'price n/a'}</span></span></label>`; }).join('')}</div>`:'<p class="muted">Nothing at this hit rate for this filter.</p>'}</div>
    <aside class="rail slip" aria-label="Hit-rate slip"><span class="label">Your slip</span>${hitSlip(chosen)}</aside></div>`;
  v.innerHTML=html;
}
function hitSlip(ch){
  if(!ch.length) return '<p class="small muted">Tap lines to stack them. 2–5 legs works best.</p>';
  const priced=ch.filter(h=>validAm(toNum(h.odds)));
  const d=priced.length===ch.length? ch.reduce((a,h)=>a*dec(h.odds),1):null;
  const hr=ch.reduce((a,h)=>a*(hitRate(h)??1),1);
  const games=new Set(ch.map(h=>h.game));
  return `<ol class="rules">${ch.map(h=>`<li>${esc(h.pick)} <span class="num muted">${h.odds!==undefined&&h.odds!==null?am(h.odds):''} · ${esc(h.hits)}/${esc(h.of)}</span></li>`).join('')}</ol>
    <dl class="small" style="display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0">
      <dt class="muted">Legs</dt><dd class="num" style="margin:0">${ch.length}${ch.length>5?' (over 5)':''}</dd>
      <dt class="muted">Price if legs multiply</dt><dd class="num" style="margin:0">${d?am(decToAm(d)):'—'}</dd>
      <dt class="muted">All legs hit together (history)</dt><dd class="num" style="margin:0">${pct(hr,0)}</dd>
    </dl>
    ${games.size<ch.length?'<p class="small muted">Same-game legs: FanDuel reprices the SGP, so the slip will pay less than the multiplied price.</p>':''}
    <div class="actions"><button class="btn primary" id="log-hits">Log this slip</button><button class="btn ghost sm" id="clear-hits">Clear</button></div>`;
}

/* ---------- PARLAYS ---------- */
function parlayStats(e, st){
  return `<dl>
    <dt>Price (legs multiplied)</dt><dd>${am(e.am)}</dd>
    <dt>Chance to hit</dt><dd>${pct(e.p)}</dd>
    <dt>Fair price</dt><dd>${am(e.fairAm)}</dd>
    <dt>Edge</dt><dd class="${edgeClass(e.ev)}">${spct(e.ev)}</dd>
    <dt>Edge if every leg is 1 pt worse</dt><dd class="${edgeClass(e.cushion)}">${spct(e.cushion)}</dd>
    <dt>Stake</dt><dd>${e.units>0?uu(e.units)+' · '+money(e.units*unitDollars()):'Pass'}</dd>
  </dl>`;
}
function renderParlays(){
  const v = document.getElementById('v-parlays');
  if(S.dbState==='loading' || (S.dbState==='on' && !S.slatesLoaded)){ v.innerHTML='<p class="muted">Loading…</p>'; return; }
  const sl = currentSlate(); const st = S.settings;
  const opts = S.slates.map(s=>`<option value="${esc(s.id)}" ${sl&&s.id===sl.id?'selected':''}>${esc(niceDate(s.date))} · ${esc(s.title||'Slate')}${s.example?' (example)':''}</option>`).join('');
  let html = `<div class="row spread"><div><h2>Parlays</h2><p class="note">${research(st)?'Cross-game parlays built from the day\'s tiered research plays, one leg per game.':'Cross-game parlays built only from plays that already have an edge on their own. Legs from different games don\'t get repriced, so the edges multiply.'} Variance stacks, which is why stakes are capped at ${uu(st.parlayMax)}.</p></div>
    ${S.slates.length?`<div class="field"><label class="label" for="slate-pick-par">Slate</label><select id="slate-pick-par">${opts}</select></div>`:''}</div>`;
  if(!sl){ v.innerHTML = html + '<div class="empty"><h3>No slate yet</h3><p>Parlays build from the day\'s priced plays.</p></div>'; return; }
  const curated = Array.isArray(sl.parlays) ? sl.parlays : [];
  if(curated.length){
    html += `<div><span class="label">Today's parlays</span><div class="sgps" style="margin-top:8px">${curated.map((pl,i)=>{ const e=parlayEval(pl.legs,st,toNum(pl.modelP),pl); if(!e.ok) return '';
      return `<div class="sgp"><div class="row spread"><div><span class="label">${e.n} legs · ${new Set(pl.legs.map(l=>l.game)).size} games</span><h3>${esc(pl.name||'Parlay')}</h3></div><span class="pill ${e.units>0&&!pl.pass?'p-std':'p-pass'}">${e.units>0&&!pl.pass?uu(e.units):'Pass'}</span></div>
        <ol>${pl.legs.map(l=>`<li><span>${esc(l.pick)}<span class="sub">${esc(l.game||'')}</span></span><span class="num">${am(l.odds)} · ${pct(toNum(l.modelP),0)}</span></li>`).join('')}</ol>
        ${pl.why?`<p class="small">${esc(pl.why)}</p>`:''}
        ${parlayStats(e,st)}
        ${e.clash?'<p class="small t-bad">Two legs share a game. Price it as an SGP instead.</p>':''}
        <div class="betat"><span class="small muted">Book should pay about ${am(e.am)}. Take it only at ${am(decToAm((1+st.minEdge/100)/e.p))} or better.</span>${e.units>0&&!pl.pass?`<button class="logbtn" data-parlog="${i}">Log bet</button>`:''}</div></div>`; }).join('')}</div></div>`;
  }
  const pool = legPool(sl, st);
  S.pb = S.pb.filter(k=>pool.some(l=>l.key===k));

  html += `<div class="board" style="margin-top:6px"><div class="stack" style="gap:10px">
    <div><span class="label">Builder · ${research(st)?'tiered plays today':'plays with an edge today'}</span><p class="small muted">Tap to add. One leg per game (same-game combos belong in the Top 10 SGPs). Games that already started drop off.</p></div>
    ${pool.length?`<div class="legs">${pool.map(l=>{ const on=S.pb.includes(l.key); const clash=!on && chosenGames.has(l.game);
      return `<label class="leg ${on?'on':''} ${clash?'clash':''}" for="leg-${esc(l.key)}"><input type="checkbox" id="leg-${esc(l.key)}" data-leg="${esc(l.key)}" ${on?'checked':''} ${clash?'disabled':''}>
        <span><span class="pick" style="font-weight:600">${esc(l.pick)}</span><span class="sub">${esc(l.game)} · ${esc(l.sport||'')}${l.start?' · '+esc(l.start):''}${clash?' · game already in slip':''}</span></span>
        <span class="num small" style="text-align:right">${am(l.odds)}<span class="sub ${edgeClass(l.ev)}">${spct(l.ev)} edge</span></span></label>`; }).join('')}</div>`
      :'<p class="muted">No plays clear the edge bar on this slate, so there is nothing to parlay.</p>'}
  </div>
  <aside class="rail slip" aria-label="Parlay slip"><span class="label">Your parlay</span>
    ${chosen.length<2?`<p class="small muted">Pick at least 2 legs.</p>`:`<ol class="rules">${chosen.map(l=>`<li>${esc(l.pick)} <span class="num muted">${am(l.odds)}</span></li>`).join('')}</ol>
      <div class="sgp" style="background:none;border:0;padding:0">${parlayStats(e,st)}</div>
      ${e.units>0?`<button class="btn primary" id="log-built">Log this parlay</button>`:`<p class="small muted">No stake: edge under ${st.minEdge}% or over the risk cap.</p>`}
      <button class="btn ghost sm" id="clear-built">Clear</button>`}
  </aside></div>`;
  v.innerHTML = html;
}

/* ---------- PERFORMANCE ---------- */
function agg(list){
  const settled = list.filter(b=>['win','loss','push'].includes(b.result));
  const w = settled.filter(b=>b.result==='win').length, l = settled.filter(b=>b.result==='loss').length, pu = settled.filter(b=>b.result==='push').length;
  const units = settled.reduce((a,b)=>a+pl(b),0);
  const risked = settled.filter(b=>b.result!=='push').reduce((a,b)=>a+(toNum(b.stake)||0),0);
  const cl = list.map(clv).filter(x=>x!==null);
  const lc = list.map(b=>EXEC.clvFields(betView(b)).line_clv).filter(x=>x!==null);
  return {n:settled.length, w, l, pu, units, roi: risked? units/risked : null, clv: cl.length? cl.reduce((a,b)=>a+b,0)/cl.length : null, beat: cl.length? cl.filter(x=>x>0).length/cl.length : null, clvN: cl.length,
          lineClv: lc.length? lc.reduce((a,b)=>a+b,0)/lc.length : null, lineN: lc.length, lineBeat: lc.length? lc.filter(x=>x>0).length/lc.length : null};
}
function expU(list){ return list.reduce((t,b)=>{ const c=clv(b); return t + (c===null?0:(toNum(b.stake)||0)*c); },0); }
function renderPerf(){
  const v = document.getElementById('v-perf');
  const bets = S.bets;
  const a = agg(bets);
  let html = `<div><h2>Performance</h2><p class="note">Judge the process by CLV and ROI in units. Under about 100 settled bets, the record is mostly noise, so a 3-0 or 0-5 category tells you very little.</p></div>`;
  if(!bets.length){ v.innerHTML = html + '<div class="empty"><span class="label">No data yet</span><h3>Results show up after you log bets</h3><p>Units, ROI, CLV and a running chart build from the Bet log automatically.</p></div>'; return; }
  html += `<div class="strip">
    <div><span class="label">Record</span><span class="big">${a.w}-${a.l}${a.pu?'-'+a.pu:''}</span><span class="small muted">${a.n} settled</span></div>
    <div><span class="label">Units</span><span class="big ${a.units>0?'t-good':a.units<0?'t-bad':''}">${u(a.units)}</span><span class="small muted">${money(a.units*unitDollars())}</span></div>
    <div><span class="label">ROI</span><span class="big ${a.roi>0?'t-good':a.roi<0?'t-bad':''}">${spct(a.roi)}</span><span class="small muted">per unit risked</span></div>
    <div><span class="label">Avg price CLV${a.clvN<200?'<span class="badge-noise">n&lt;200: noise</span>':''}</span><span class="big ${a.clv>0?'t-good':a.clv<0?'t-bad':''}">${spct(a.clv)}</span><span class="small muted">${a.clvN} with a close · real skill shows after ~200</span></div>
    <div><span class="label">Avg line CLV</span><span class="big ${a.lineClv>0?'t-good':a.lineClv<0?'t-bad':''}">${a.lineClv===null?'—':(a.lineClv>0?'+':'')+a.lineClv.toFixed(2)+' pts'}</span><span class="small muted">${a.lineN} spread/total/prop bets with both numbers${a.lineBeat!==null?' · beat the closing number '+pct(a.lineBeat,0):''}</span></div>
    <div><span class="label">Expected units (from price CLV)</span><span class="big ${expU(bets)>0?'t-good':expU(bets)<0?'t-bad':''}">${u(expU(bets))}</span><span class="small muted">vs ${u(a.units)} actual. Luck is the gap</span></div>
    <div><span class="label">Beat the close</span><span class="big">${pct(a.beat,0)}</span><span class="small muted">sharp bettors sit above 50%</span></div>
  </div>`;
  // chart
  const settled = bets.filter(b=>['win','loss','push'].includes(b.result)).slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)) || String(x.loggedAt).localeCompare(String(y.loggedAt)));
  if(settled.length>=2){
    let run=0; const pts=[0, ...settled.map(b=>(run+=pl(b)))];
    const W=760,H=220,L=48,R=16,T=16,B=28;
    let lo=Math.min(0,...pts), hi=Math.max(0,...pts); if(hi-lo<1){hi+=0.5;lo-=0.5;}
    const x=i=>L+(W-L-R)*i/(pts.length-1), y=val=>T+(H-T-B)*(1-(val-lo)/(hi-lo));
    const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p).toFixed(1)).join(' ');
    const area=line+` L${x(pts.length-1).toFixed(1)} ${y(0).toFixed(1)} L${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;
    const ticks=[lo,0,hi].filter((t,i,arr)=>arr.indexOf(t)===i);
    const endC = pts[pts.length-1]>=0 ? 'var(--good)' : 'var(--bad)';
    html += `<div class="panel chart"><div class="row spread"><span class="label">Running units · settled bets in order</span><span class="num small">${settled.length} bets</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running units, now ${u(pts[pts.length-1])}">
        ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t===0?'':'stroke-dasharray="3 4"'}/><text x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end">${t===0?'0':u(t,1)}</text>`).join('')}
        <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1]).toFixed(1)}" r="4.5" fill="${endC}" stroke="var(--surface)" stroke-width="2"/>
        <text x="${L}" y="${H-8}">bet 1</text><text x="${W-R}" y="${H-8}" text-anchor="end">bet ${settled.length}</text>
      </svg></div>`;
  }
  const breakdown = (key, label) => {
    const groups = {}; bets.forEach(b=>{ const k=b[key]||'—'; (groups[k]=groups[k]||[]).push(b); });
    const rows = Object.entries(groups).map(([k,list])=>({k, ...agg(list)})).sort((p,q)=>q.units-p.units);
    return `<div class="panel" style="padding:0;overflow:hidden"><div style="padding:14px 16px 0"><h3>By ${label}</h3></div><div class="scroll" style="border:0;border-radius:0"><table><thead><tr><th>${label}</th><th class="n">Bets</th><th class="n">Record</th><th class="n">Units</th><th class="n">ROI</th><th class="n">Avg CLV</th><th>Read</th></tr></thead><tbody>
      ${rows.map(r=>{ const read = r.clvN<10 ? ['Too early','p-pass'] : r.clv>0.01 ? ['Beating close','p-strong'] : r.clv<-0.01 ? ['Losing to close','p-bad'] : ['Flat','p-std'];
        return `<tr><td>${esc(r.k)}</td><td class="n num">${r.n}</td><td class="n num">${r.w}-${r.l}${r.pu?'-'+r.pu:''}</td><td class="n num ${r.units>0?'t-good':r.units<0?'t-bad':''}">${u(r.units)}</td><td class="n num">${spct(r.roi)}</td><td class="n num ${r.clv>0?'t-good':r.clv<0?'t-bad':''}">${spct(r.clv)}</td><td><span class="pill ${read[1]}">${read[0]}</span></td></tr>`; }).join('')}
      </tbody></table></div></div>`;
  };
  html += `<div class="grid2">${breakdown('sport','Sport')}${breakdown('category','Category')}</div>`;
  v.innerHTML = html;
}

/* ---------- log sheet ---------- */
function marketType(x){ const t=((x&&x.market)||'')+' '+((x&&x.category)||'')+' '+((x&&x.pick)||'');
  if(/SGP|parlay|slip/i.test(t)) return 'other';
  if(/money\s*line|\bML\b/i.test(t)) return 'moneyline';
  if(/spread|run line|puck line/i.test(t) || /\s[+-]\d+(\.5)?\s*$/.test((x&&x.pick)||'')) return 'spread';
  if(/total/i.test(((x&&x.market)||'')+' '+((x&&x.category)||''))) return 'total';
  if(/prop|yds|yards|TD|scorer|rush|rec|pass|points|rebounds|assists|strikeouts|hits|shots|saves|goal/i.test(t)) return 'prop';
  if(/total|over|under/i.test(t)) return 'total';
  return 'other'; }
function openSheet(pre){ S.sheet = {date: pre.date||todayISO(), pick:pre.pick||'', game:pre.game||'', sport:pre.sport||'', category:pre.category||'', odds: pre.odds!==undefined&&pre.odds!==null? am(pre.odds):'', stake: pre.stake!==undefined? String(pre.stake):'1', book: pre.book||'', pickId: pre.pickId||null, slateId: pre.slateId||null, locked: !!pre.pickId,
  line: pre.line!==undefined&&pre.line!==null? String(pre.line) : (EXEC.currentLine({pick:pre.pick})??''), mtype: pre.market_type||marketType(pre), tier: pre.tier||null, betStatus: pre.bet_status||null}; drawSheet(); setTimeout(()=>{ const el=document.getElementById('sh-odds'); if(el) el.focus(); },30); }
function closeSheet(){ S.sheet=null; drawSheet(); }
function drawSheet(){
  const r = document.getElementById('sheet-root'); const s=S.sheet;
  if(!s){ r.innerHTML=''; return; }
  const inp=(id,label,val,extra='')=>`<div class="field"><label class="label" for="${id}">${label}</label><input id="${id}" value="${esc(val)}" ${extra}></div>`;
  r.innerHTML = `<div class="sheet-back" id="sheet-back"><form class="sheet" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="row spread"><h3 id="sh-title">${s.locked?'Log this bet':'Log a bet'}</h3><button type="button" class="btn sm ghost" id="sh-cancel">Cancel</button></div>
    ${s.locked?`<div><span class="pick" style="font-weight:600">${esc(s.pick)}</span><div class="small muted">${esc(s.game)} · ${esc(s.sport)}</div></div>`:''}
    <div class="form">
      ${s.locked?'':inp('sh-pick','Play',s.pick,'required placeholder="Under 38.5"')+inp('sh-game','Game',s.game,'placeholder="PIT @ CLE"')+inp('sh-sport','Sport',s.sport,'placeholder="NFL"')+inp('sh-cat','Category',s.category,'placeholder="NFL totals"')}
      ${inp('sh-odds','Price you got',s.odds,'class="num" inputmode="numeric" required placeholder="-110"')}
      <div class="field"><label class="label" for="sh-mtype">Market</label><select id="sh-mtype">${['moneyline','spread','total','prop','other'].map(m=>`<option value="${m}" ${s.mtype===m?'selected':''}>${m}</option>`).join('')}</select></div>
      ${inp('sh-line','Line you got (spreads, totals, props)',s.line,'class="num" inputmode="decimal" placeholder="-2.5 or 38.5"')}
      ${inp('sh-stake','Stake (u)',s.stake,'class="num" inputmode="decimal" required')}
      ${inp('sh-book','Book',s.book,'placeholder="FanDuel"')}
      ${inp('sh-date','Date',s.date,'type="date"')}
    </div>
    <p class="small muted" id="sh-msg">Log the line and price you actually got, not the card's. CLV is judged on both.</p>
    <button class="btn primary" type="submit">Save to log</button>
  </form></div>`;
}
async function saveSheet(){
  const s=S.sheet; const g=id=>{const el=document.getElementById(id); return el?el.value.trim():null;};
  const odds=toNum(g('sh-odds')), stake=toNum(g('sh-stake'));
  const msg=document.getElementById('sh-msg');
  if(!validAm(odds)){ msg.textContent='Enter American odds, like -110 or +150.'; msg.className='small t-bad'; return; }
  if(!(stake>0)){ msg.textContent='Enter a stake above 0 units.'; msg.className='small t-bad'; return; }
  const mtype=g('sh-mtype')||'other'; const lineRaw=g('sh-line'); const line=toNum(lineRaw);
  if(['spread','total','prop'].includes(mtype) && line===null){ msg.textContent='Enter the line you got (e.g. -2.5 or 38.5): CLV needs the number, not just the price.'; msg.className='small t-bad'; return; }
  const pickTxt = s.locked? s.pick : (g('sh-pick')||'Bet');
  const extra = {market_type:mtype, taken_line: mtype==='moneyline'||mtype==='other'? null : line, taken_price:odds,
                 line_dir: EXEC.lineDir(pickTxt), research_tier: s.tier, bet_status_at_log: s.betStatus, schema:2};
  const rec = {...extra, date:g('sh-date')||todayISO(), pick: s.locked? s.pick : (g('sh-pick')||'Bet'), game: s.locked? s.game : (g('sh-game')||''), sport: s.locked? s.sport : (g('sh-sport')||'Other'), category: s.locked? s.category : (g('sh-cat')||''), odds, stake, book:g('sh-book')||'', close:null, result:'open', pickId:s.pickId, slateId:s.slateId, loggedAt:new Date().toISOString() };
  if(!S.db){ msg.textContent='Saving is off in this view. Open the page from your Claude account.'; msg.className='small t-bad'; return; }
  try{ await S.db.collection('bets').add(rec); closeSheet(); toast('Logged: '+rec.pick+' '+am(odds)+' · '+uu(stake)); }
  catch(e){ msg.textContent = e&&e.code==='quota_exceeded' ? 'The log is full. Delete old bets to make room.' : 'Couldn\'t save. Check your connection and try again.'; msg.className='small t-bad'; }
}
