name: Pull sports data

on:
  schedule:
    # Cron is UTC, so each ET time has two entries: one for EDT, one for EST. The "Decide" step
    # keeps only the entry that matches today's offset, so runs land at 10:30 AM and 4:30 PM ET
    # all year (~20 min ahead of the 10:50 AM and 4:50 PM re-check task).
    # No scheduled odds pull: the daily slate task (8:54 AM ET) triggers this workflow by hand (workflow_dispatch) with odds + props.
    - cron: "30 14 * * *"   # 10:30 AM EDT  (lineups, injuries; no odds)
    - cron: "30 15 * * *"   # 10:30 AM EST
    - cron: "30 20 * * *"   # 4:30 PM EDT
    - cron: "30 21 * * *"   # 4:30 PM EST
  workflow_dispatch:
    inputs:
      run_odds:
        description: "Pull odds this run (uses API credits)"
        type: choice
        options: ["1", "0"]
        default: "1"
      props:
        description: "Also pull player props (expensive on credits)"
        type: choice
        options: ["0", "1"]
        default: "0"
      slate_date:
        description: "Optional YYYY-MM-DD (defaults to today ET)"
        required: false
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pull-data.yml", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Offline tests
        run: python -m pytest -q tests

      - name: Decide what to pull
        id: plan
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          SKIP=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # keep the EDT crons when New York is on UTC-4, the EST crons when it's on UTC-5
            OFFSET=$(TZ=America/New_York date +%z)
            case "$OFFSET:$SCHEDULE" in
              "-0400:30 14 * * *"|"-0400:30 20 * * *"|"-0500:30 15 * * *"|"-0500:30 21 * * *") SKIP=0 ;;
              *) SKIP=1 ;;
            esac
            echo "offset=$OFFSET schedule='$SCHEDULE' skip=$SKIP"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          ODDS=0
          if [ "${{ github.event_name }}" = "push" ]; then ODDS=1; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ODDS="${{ inputs.run_odds }}"; fi
          echo "run_odds=$ODDS" >> "$GITHUB_OUTPUT"
          PROPS="${{ inputs.props || '0' }}"
          # A push whose commit message contains [props] also pulls player props (today's games only).
          if [ "${{ github.event_name }}" = "push" ] && printf '%s' "$HEAD_MSG" | grep -q "\[props\]"; then PROPS=1; ODDS=1; echo "run_odds=1" >> "$GITHUB_OUTPUT"; fi
          echo "props=$PROPS" >> "$GITHUB_OUTPUT"

      - name: Pull data
        if: steps.plan.outputs.skip != '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          RUN_ODDS: ${{ steps.plan.outputs.run_odds }}
          PROPS: ${{ steps.plan.outputs.props }}
          SLATE_DATE: ${{ inputs.slate_date }}
        run: python -m pipeline.build_all

      - name: Commit data
        if: steps.plan.outputs.skip != '1'
        run: |
          git config user.name "boolin-bot"
          git config user.email "boolin-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET') pull"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
