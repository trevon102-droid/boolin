name: Pull sports data

on:
  schedule:
    # Times are UTC. During EDT: 12:30 PM, 5:30 PM ET (an hour earlier in ET under EST).
    # No scheduled odds pull: the daily slate task (8:54 AM ET) triggers this workflow by hand (workflow_dispatch) with odds + props.
    - cron: "30 16 * * *"   # midday: lineups, injuries (no odds, saves credits)
    - cron: "30 21 * * *"   # evening: lineups, injuries (no odds)
  workflow_dispatch:
    inputs:
      run_odds:
        description: "Pull odds this run (uses API credits)"
        type: choice
        options: ["1", "0"]
        default: "1"
      props:
        description: "Also pull player props (expensive on credits)"
        type: choice
        options: ["0", "1"]
        default: "0"
      slate_date:
        description: "Optional YYYY-MM-DD (defaults to today ET)"
        required: false
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pull-data.yml", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide what to pull
        id: plan
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          ODDS=0
          if [ "${{ github.event_name }}" = "push" ]; then ODDS=1; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ODDS="${{ inputs.run_odds }}"; fi
          echo "run_odds=$ODDS" >> "$GITHUB_OUTPUT"
          PROPS="${{ inputs.props || '0' }}"
          # A push whose commit message contains [props] also pulls player props (today's games only).
          if [ "${{ github.event_name }}" = "push" ] && printf '%s' "$HEAD_MSG" | grep -q "\[props\]"; then PROPS=1; ODDS=1; echo "run_odds=1" >> "$GITHUB_OUTPUT"; fi
          echo "props=$PROPS" >> "$GITHUB_OUTPUT"

      - name: Pull data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          RUN_ODDS: ${{ steps.plan.outputs.run_odds }}
          PROPS: ${{ steps.plan.outputs.props }}
          SLATE_DATE: ${{ inputs.slate_date }}
        run: python -m pipeline.build_all

      - name: Commit data
        run: |
          git config user.name "boolin-bot"
          git config user.email "boolin-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET') pull"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
